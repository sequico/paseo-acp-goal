version: 2

# Version updates, which is a different job from the security updates already enabled
# on this repository. The security side only moves a package that has a published
# advisory; this side moves the pins on a schedule, and it exists here for one
# specific reason.
#
# `verify.yml` pins every action to a commit SHA so a moved tag cannot run new code
# with this repository's token. A pin that nothing bumps is a pin that rots, so the
# `github-actions` entry is what turns "pinned" into "pinned and current" without
# anyone watching for releases by hand.
#
# `npm` is here because every dependency in this repository is a devDependency, and a
# devDependency is what the daemon's `--omit=dev` install deliberately does not see —
# so nothing else would ever tell us one had drifted.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
    # Six of these are not free to move, and the reason is not taste: they are the host
    # SDK and the peer dependencies it pins. `@getpaseo/plugin@0.9.1` requires
    # `react ~19.1.0` — `>=19.1.0 <19.2.0` — while `react-native@0.87` requires
    # `react ^19.2.3`, so the two ranges do not intersect and no version of react can
    # satisfy both. Dependabot proposed exactly that move as part of a group and
    # `npm ci` refused it with ERESOLVE, which is the correct outcome.
    #
    # Ignoring the SDK trio as well is what makes the rule coherent rather than
    # half-applied: a peer range can only move with the SDK that declares it, so
    # allowing the SDK to move on its own would leave every such pull request failing on
    # a peer bump this list forbids. These six are upgraded together, by hand, when the
    # plugin targets a new Paseo — `@getpaseo/*`, `react`, `react-native`, and
    # `@types/react`, with `zod` left to Dependabot because its caret range already
    # tracks the SDK's `^4.4.3` peer.
    ignore:
      - dependency-name: "@getpaseo/client"
      - dependency-name: "@getpaseo/plugin"
      - dependency-name: "@getpaseo/protocol"
      - dependency-name: react
      - dependency-name: react-native
      - dependency-name: "@types/react"
    groups:
      # The toolchain moves together or the gate reports on two regimes at once, so a
      # week's bumps arrive as one pull request whose CI run means something.
      dev-toolchain:
        patterns:
          - "*"
