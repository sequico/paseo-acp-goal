name: verify

# The gate this repository declares is 0 errors, 0 warnings, and a passing suite.
# It runs here on every push and pull request, and `main` requires this job to pass
# (with the repository owner exempt, so an owner's direct push is not blocked by a
# check that has not run yet).
#
# Every action is pinned to a commit SHA rather than a tag. A tag is mutable: whoever
# controls the action's repository can move `v4` onto different code, and that code
# would run here with this repository's token. A SHA cannot be moved, so an upgrade is
# a deliberate commit rather than something that happens to you. `dependabot.yml`
# raises those bumps, which is what keeps a pinned workflow from going stale.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only for the whole workflow, so a compromised step cannot write to the repo.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.4.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-node@v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # The pinned Node LTS. `.nvmrc` is the human-facing copy of the same fact.
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` rather than `install`, so a lockfile that does not match
      # package.json fails here instead of drifting silently in a checkout.
      - run: npm ci

      # `npm run verify` is typecheck, lint --deny-warnings --max-warnings=0,
      # format:check, and the test suite. Exit 0 means exactly zero of everything.
      - run: npm run verify

      # The daemon installs from Git with no package manager of its own and evaluates
      # the server bundle with `globalThis.eval` in a scope that has no `import.meta`
      # and no `__dirname`. Both facts are asserted by the suite, and both are worth
      # failing the build over when they change.
